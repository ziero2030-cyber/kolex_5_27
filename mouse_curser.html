<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOLEX - Custom Sakura Cursor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            min-height: 100vh;
            background-color: #f8f9fa;
            /* 기본 마우스 커서는 숨깁니다 */
            cursor: none; 
        }

        /* 커스텀 벚꽃 커서 스타일 */
        .custom-cursor {
            width: 32px;
            height: 32px;
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none; /* 커서가 아이콘 클릭을 방해하지 않도록 설정 */
            z-index: 9999;
            transform: translate(-50%, -50%); /* 마우스 포인터 정중앙에 위치 */
            transition: background-color 0.2s ease, transform 0.1s ease;
            
            /* 소지하신 사쿠라 이미지 경로를 아래에 넣으세요 */
            /* 이미지의 알파 채널(투명도)을 기준으로 마스킹됩니다 */
            -webkit-mask-image: url('./img/img_bg/sakura.png'); 
            mask-image: url('./img/img_bg/sakura.png');
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;

            /* 초기 기본 색상: 화사한 사쿠라 핑크 */
            background-color: #ffb7c5; 
        }

        /* 링크나 버튼에 호버했을 때 커서 약간 키우기 */
        a:hover ~ .custom-cursor,
        button:hover ~ .custom-cursor,
        .btn:hover ~ .custom-cursor {
            transform: translate(-50%, -50%) scale(1.2);
        }

        /* 클릭 액션 시 순간적으로 커서가 살짝 수축하는 효과 */
        .custom-cursor.click-active {
            transform: translate(-50%, -50%) scale(0.9);
        }

        /* 부트스트랩 테마별 커서 색상 정의 */
        .cursor-primary   { background-color: #0d6efd !important; }
        .cursor-secondary { background-color: #6c757d !important; }
        .cursor-success   { background-color: #198754 !important; }
        .cursor-danger    { background-color: #dc3545 !important; }
        .cursor-warning   { background-color: #ffc107 !important; }
        .cursor-info      { background-color: #0dcaf0 !important; }
        .cursor-sakura    { background-color: #ffb7c5 !important; } /* 시그니처 핑크 */
    </style>
</head>
<body>

    <div class="custom-cursor" id="sakuraCursor"></div>

    <div class="container py-5 text-center">
        <h1 class="fw-bold mb-4">Sakura Responsive Cursor</h1>
        <p class="text-muted mb-5">아래 버튼들을 클릭하면 마우스 커서의 색상이 해당 부트스트랩 상태 컬러로 변경됩니다.</p>

        <div class="row g-3 justify-content-center">
            <div class="col-6 col-md-auto">
                <button class="btn btn-outline-danger w-100 theme-btn" data-color="cursor-sakura">Sakura Pink</button>
            </div>
            <div class="col-6 col-md-auto">
                <button class="btn btn-primary w-100 theme-btn" data-color="cursor-primary">Primary Blue</button>
            </div>
            <div class="col-6 col-md-auto">
                <button class="btn btn-success w-100 theme-btn" data-color="cursor-success">Success Green</button>
            </div>
            <div class="col-6 col-md-auto">
                <button class="btn btn-warning w-100 theme-btn" data-color="cursor-warning">Warning Yellow</button>
            </div>
            <div class="col-6 col-md-auto">
                <button class="btn btn-danger w-100 theme-btn" data-color="cursor-danger">Danger Red</button>
            </div>
            <div class="col-6 col-md-auto">
                <button class="btn btn-info w-100 theme-btn" data-color="cursor-info">Info Cyan</button>
            </div>
        </div>
    </div>

    <script>
        const cursor = document.getElementById('sakuraCursor');

        // 1. 마우스 움직임에 따라 커서 위치 동기화
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // 2. 클릭 시 꾹 누르는 시각 효과 피드백
        document.addEventListener('mousedown', () => {
            cursor.classList.add('click-active');
        });
        document.addEventListener('mouseup', () => {
            cursor.classList.remove('click-active');
        });

        // 3. 버튼 클릭 시 상황(테마)에 맞춰 커서 색상 변경하기
        const buttons = document.querySelectorAll('.theme-btn');
        
        buttons.forEach(button => {
            button.addEventListener('click', (e) => {
                // 기존 커서 색상 클래스 모두 제거
                cursor.className = 'custom-cursor';
                
                // 버튼에 지정된 data-color 값 가져와서 추가
                const targetColor = e.target.getAttribute('data-color');
                cursor.classList.add(targetColor);
            });
        });
    </script>
</body>
</html>
